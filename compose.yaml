services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spitzli
      POSTGRES_USER: spitzli
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spitzli -d spitzli"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres:
